<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jiwon Kwon</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: EB Garamond & Noto Serif KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #8b1e1e;          /* 딥 버건디 */
      --primary-hover: #6b1414;    /* 짙은 버건디 */
      --text-main: #2b2b2b;        /* 흑연색 본문 */
      --text-muted: #666666;       /* 차분한 보조 텍스트 */
      --bg: #f7f5f0;               /* 웜 아이보리/크림 배경 */
      --border: #e6e2d8;           /* 클래식 구분선 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: "EB Garamond", "Noto Serif KR", Garamond, "Times New Roman", serif;
      font-size: 1.18rem;
      line-height: 1.8;
      color: var(--text-main);
      background-color: var(--bg);
      margin: 0;
      padding: 0;
    }

    /* 레이아웃 공통 너비 제한 (가독성을 위한 중앙 정렬) */
    .content-wrapper {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 28px;
    }

    /* Top Header */
    header {
      width: 100%;
      padding: 48px 0 28px;
      border-bottom: 1px solid var(--border);
    }
    
    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    
    .name-title h1 { 
      font-size: 2.5rem; 
      font-weight: 700; 
      color: #1a1a1a; 
      letter-spacing: -0.01em;
      margin-bottom: 4px; 
    }
    
    .name-title p { 
      font-size: 1.2rem; 
      color: var(--text-muted); 
      font-style: italic;
    }

    .profile-img {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      flex-shrink: 0;
    }
    
    .header-links {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    
    .header-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 1.05rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    
    .header-links a:hover { color: var(--primary); }

    /* CV Button */
    .cv-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      background: var(--primary);
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    .cv-btn:hover { background: var(--primary-hover); }

    /* Navigation Bar (Full Width & Centered Tabs) */
    nav {
      width: 100%;
      border-bottom: 1px solid var(--border);
      background-color: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }
    
    .tab-btn {
      font-family: inherit;
      padding: 16px 24px;
      border: none;
      background: none;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    
    .tab-btn:hover { color: var(--primary); }
    
    .tab-btn.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      background: transparent;
    }

    /* Main Content Area */
    main { 
      padding: 44px 0 80px; 
      min-height: 400px;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.25s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 { 
      font-size: 1.6rem; 
      font-weight: 600; 
      margin-bottom: 20px; 
      color: #1a1a1a; 
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    @media (max-width: 640px) {
      body { font-size: 1.08rem; }
      .content-wrapper { padding: 0 18px; }
      header { padding: 32px 0 20px; }
      .profile-header { flex-direction: column-reverse; align-items: flex-start; }
      .profile-img { width: 90px; height: 90px; }
      .nav-inner { justify-content: flex-start; }
      .tab-btn { padding: 12px 16px; font-size: 1.05rem; }
      main { padding: 32px 0 60px; }
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="content-wrapper">
      <div class="profile-header">
        <div class="name-title">
          <h1>Jiwon Kwon 권지원</h1>
        </div>
        <!-- 프로필 사진: 같은 폴더에 profile.jpg 업로드 시 표시 -->
        <img src="profile.jpg" alt="Jiwon Kwon" class="profile-img" onerror="this.style.display='none'">
      </div>
      
      <div class="header-links">
        <a href="mailto:jwkwon@sas.upenn.edu"><i class="fa-solid fa-envelope"></i> Email</a>
        <a href="https://scholar.google.com" target="_blank"><i class="fa-brands fa-google-scholar"></i> Google Scholar</a>
        <a href="https://github.com" target="_blank"><i class="fa-brands fa-github"></i> GitHub</a>
        <a href="https://linkedin.com" target="_blank"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>
        <!-- CV 다운로드 링크 (같은 폴더에 cv.pdf 업로드 시 작동) -->
        <a href="cv.pdf" class="cv-btn" target="_blank" download>
          <i class="fa-solid fa-file-pdf"></i> CV (PDF)
        </a>
      </div>
    </div>
  </header>

  <!-- Top Navigation Bar -->
  <nav>
    <div class="content-wrapper nav-inner">
      <button class="tab-btn active" onclick="switchTab(event, 'about')">About</button>
      <button class="tab-btn" onclick="switchTab(event, 'research')">Research</button>
      <button class="tab-btn" onclick="switchTab(event, 'cv')">CV</button>
      <button class="tab-btn" onclick="switchTab(event, 'music')">Music</button>
      <button class="tab-btn" onclick="switchTab(event, 'other')">Other</button>
    </div>
  </nav>

  <!-- Main Content Tabs -->
  <main>
    <div class="content-wrapper">
      <!-- About Tab -->
      <section id="about" class="tab-pane active">
        <h2>About</h2>
        <!-- 여기에 About 내용을 작성하세요 -->
      </section>

      <!-- Research Tab -->
      <section id="research" class="tab-pane">
        <h2>Research</h2>
        <!-- 여기에 Research / 논문 목록을 작성하세요 -->
      </section>

      <!-- CV Tab -->
      <section id="cv" class="tab-pane">
        <h2>Curriculum Vitae</h2>
        <!-- 여기에 학력, 경력 등 상세 이력을 작성하세요 -->
      </section>

      <!-- Music Tab -->
      <section id="music" class="tab-pane">
        <h2>Music</h2>
        <!-- 여기에 음악 활동 및 포트폴리오를 작성하세요 -->
      </section>

      <!-- Other Tab -->
      <section id="other" class="tab-pane">
        <h2>Other</h2>
        <!-- 여기에 취미, 블로그, 기타 관심사를 작성하세요 -->
      </section>
    </div>
  </main>

  <!-- JavaScript for Tab Switching -->
  <script>
    function switchTab(evt, tabId) {
      const tabPanes = document.querySelectorAll('.tab-pane');
      tabPanes.forEach(pane => pane.classList.remove('active'));

      const tabButtons = document.querySelectorAll('.tab-btn');
      tabButtons.forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      evt.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
